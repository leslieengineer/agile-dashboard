allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile
max_packet_size 16384

listener 1883 127.0.0.1
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# Production WebUI traffic should use WSS. Add a TLS listener and set
# cafile, certfile and keyfile before exposing this service outside a trusted LAN.
